<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareMyRide - Book Now</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #ff7e5f, #6a11cb);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .btn-custom {
      background-color: #007bff;
      color: #fff;
      font-weight: bold;
      border-radius: 10px;
    }
    nav {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
    }
  </style>
</head>
<body>


  <!-- Booking Form -->
  <div class="container mt-5">
    <div class="card p-4">
      <h2 class="text-center mb-4">Book Now</h2>
      <!-- Google Map -->
      <div class="mb-3">
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3153.0863509222243!2d-122.41941568468198!3d37.77492927975998!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8085809c5b0b0d5d%3A0xf37c9f7cde7f59c0!2sSan%20Francisco!5e0!3m2!1sen!2sus!4v1703272987602!5m2!1sen!2sus" 
          width="100%" height="250" style="border-radius:10px;" allowfullscreen="" loading="lazy"></iframe>
      </div>

      <form>
        <div class="row mb-3">
          <div class="col">
            <input type="text" class="form-control" placeholder="From" required>
          </div>
          <div class="col">
            <input type="text" class="form-control" placeholder="To" required>
          </div>
        </div>
        <div class="row mb-3">
          <div class="col">
            <input type="date" class="form-control" required>
          </div>
          <div class="col">
            <input type="time" class="form-control" required>
          </div>
        </div>
        <button type="submit" class="btn btn-custom w-100">Book Now</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
