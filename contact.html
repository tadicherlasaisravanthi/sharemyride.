<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShareMyRyde - Helpline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .helpline-card {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
    }
    .helpline-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .helpline-header h1 {
      font-weight: 700;
      color: #0072ff;
    }
    .contact-icon {
      font-size: 2rem;
      color: #0072ff;
    }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7">
        <div class="helpline-card">
          <div class="helpline-header">
            <h1>🚗 Share My Ride Helpline</h1>
            <p class="text-muted">We’re here to assist you anytime</p>
          </div>
          <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">ShareMyRide</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="aboutpage.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="signup.html">signup</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

          <div class="row text-center mb-4">
            <div class="col-md-4">
              <div class="p-3">
                <div class="contact-icon">📞</div>
                <h5>Call Us</h5>
                <p class="mb-0">+91 98765 43210</p>
              </div>
            </div>
            <div class="col-md-4">
              <div class="p-3">
                <div class="contact-icon">✉️</div>
                <h5>Email</h5>
                <p class="mb-0">support/shareride@gmail.com</p>
              </div>
            </div>
            <div class="col-md-4">
              <div class="p-3">
                <div class="contact-icon">💬</div>
                <h5>Complents</h5>
                <p class="mb-0">24/7 Available</p>
              </div>
            </div>
          </div>

          <h5 class="mb-3">Send Us a Message</h5>
          <form>
            <div class="mb-3">
              <label class="form-label">Your Name</label>
              <input type="text" class="form-control" placeholder="Enter your full name">
            </div>
            <div class="mb-3">
              <label class="form-label">Destination</label>
              <input type="Text" class="form-control" placeholder="enter your place">
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" placeholder="Describe your issue"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Submit</button>
          </form>
            <div class="text-center mt-4">
            <small class="text-muted">Our team will respond within 24 hours.</small>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
